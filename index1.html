        <a href="mailto:partners@whitelabelresell.com" onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{fontFamily:'Geist',fontSize:'clamp(40px,7vw,112px)',fontWeight:500,letterSpacing:'-.04em',lineHeight:.92,borderBottom:hover?'3px solid #FFF':'3px solid rgba(255,255,255,.2)',paddingBottom:12,display:'inline-block',transition:'border-color .3s ease'}}>partners@<br/>whitelabelresell.com</a>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:'clamp(16px,2vw,32px)',marginTop:'clamp(48px,6vh,80px)',position:'relative',zIndex:1}}>
        <div style={{flex:1,height:1,background:'rgba(255,255,255,.15)'}}/>
        <div style={{fontFamily:'"Geist Mono",monospace',fontSize:11,letterSpacing:'.22em',textTransform:'uppercase',opacity:.4,whiteSpace:'nowrap'}}>DISCORD FOR ACTIVE PARTNERS</div>
      </div>
    </section>
  );
};

const ContactPage=({onNav})=>(
  <React.Fragment>
    <ContactHero/>
    <ContactForm/>
    <ContactClosing/>
    <Footer onNav={onNav}/>
  </React.Fragment>
);


/* ══════════════════════════════════════════════════════════════
   APP — page router
   ══════════════════════════════════════════════════════════════ */
const App=()=>{
  const[page,setPage]=useState('home');
  const onNav=(p)=>{setPage(p);window.scrollTo(0,0)};
  const pages={home:HomePage,work:WorkPage,about:AboutPage,team:TeamPage,contact:ContactPage};
  const Page=pages[page];
  return(
    <React.Fragment>
      <HUD page={page} onNav={onNav}/>
      <ScrollPct/>
      <Page onNav={onNav}/>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
